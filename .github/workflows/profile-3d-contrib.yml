name: GitHub Profile 3D Contrib

on:
  schedule:
    - cron: "0 21 * * *"   # каждый день в 00:00 по Москве
  workflow_dispatch:        # ручной запуск из вкладки Actions

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: yoshi389111/github-profile-3d-contrib@0.7.1
        env:
          # Чтобы учитывались приватные репозитории, создай PAT (classic, scope: repo, read:user),
          # добавь его в Settings → Secrets → Actions как MY_GITHUB_TOKEN и замени строку ниже на:
          # GITHUB_TOKEN: ${{ secrets.MY_GITHUB_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USERNAME: ${{ github.repository_owner }}

      - name: Commit & push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A .
          git diff --cached --quiet || git commit -m "chore: update 3D contributions"
          git push
