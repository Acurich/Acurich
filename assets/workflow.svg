<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 330" width="900" height="330" font-family="'JetBrains Mono','Fira Code',Consolas,'Courier New',monospace" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse">
      <circle cx="1.5" cy="1.5" r="1.2" fill="#1c2430"/>
    </pattern>
    <linearGradient id="frame" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ff2a6d"/>
      <stop offset="1" stop-color="#05d9e8"/>
    </linearGradient>
    <linearGradient id="flow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ff2a6d"/>
      <stop offset="1" stop-color="#05d9e8"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="bigglow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="14"/>
    </filter>

    <!-- edge paths -->
    <path id="e1" d="M200 165 C 260 165 280 165 340 165"/>
    <path id="e2" d="M540 165 C 620 165 610 98 700 98"/>
    <path id="e3" d="M540 165 C 620 165 620 165 700 165"/>
    <path id="e4" d="M540 165 C 620 165 610 232 700 232"/>
    <path id="s1" d="M405 213 C 405 235 335 235 335 258"/>
    <path id="s2" d="M440 213 L 440 258"/>
    <path id="s3" d="M475 213 C 475 235 545 235 545 258"/>

    <style>
      .edge-base { fill:none; stroke:#ff2a6d; stroke-opacity:.18; stroke-width:2; }
      .edge-flow { fill:none; stroke:url(#flow); stroke-width:2; stroke-dasharray:6 12; animation: dash 1.2s linear infinite; }
      .sub-flow  { fill:none; stroke:#05d9e8; stroke-opacity:.7; stroke-width:1.5; stroke-dasharray:3 6; animation: dash 1.6s linear infinite reverse; }
      .node   { fill:#111823; stroke:#2a3442; stroke-width:1.5; }
      .title  { fill:#ffffff; font-size:15px; font-weight:700; letter-spacing:.5px; }
      .sub    { fill:#8b949e; font-size:11px; }
      .port   { fill:#0d1117; stroke-width:2; }
      .blink  { animation: blink 1s steps(1) infinite; }
      .pulse  { animation: pulse 2.4s ease-in-out infinite; }
      .scan   { animation: scan 6s linear infinite; }
      .out    { animation: hit 3s ease-in-out infinite; }
      .d1 { animation-delay: 0s; } .d2 { animation-delay: .5s; } .d3 { animation-delay: 1s; }
      @keyframes dash  { to { stroke-dashoffset: -36; } }
      @keyframes blink { 50% { opacity: 0; } }
      @keyframes pulse { 0%,100% { opacity:.35; } 50% { opacity:.85; } }
      @keyframes scan  { 0% { transform: translateY(40px); opacity:0; } 10% { opacity:.3; } 90% { opacity:.3; } 100% { transform: translateY(320px); opacity:0; } }
      @keyframes hit   { 0%,60%,100% { stroke:#2a3442; } 75% { stroke:#05d9e8; } }
    </style>
  </defs>

  <!-- frame -->
  <rect x="1" y="1" width="898" height="328" rx="14" fill="#0d1117" stroke="url(#frame)" stroke-width="1.5" stroke-opacity=".7"/>
  <rect x="2" y="38" width="896" height="290" fill="url(#dots)"/>
  <rect x="2" y="0" width="896" height="2" fill="#05d9e8" opacity=".25" class="scan"/>

  <!-- title bar -->
  <path d="M1 37 H899" stroke="#1f2733"/>
  <circle cx="22" cy="19" r="5.5" fill="#ff2a6d"/>
  <circle cx="40" cy="19" r="5.5" fill="#f9f002"/>
  <circle cx="58" cy="19" r="5.5" fill="#05d9e8"/>
  <text x="82" y="23.5" fill="#c9d1d9" font-size="12">~/n8n/autopilot.workflow</text>
  <circle cx="800" cy="19" r="4" fill="#05d9e8" class="blink"/>
  <text x="812" y="23.5" fill="#05d9e8" font-size="12" font-weight="700" letter-spacing="1.5">RUNNING</text>

  <!-- edges -->
  <use href="#e1" class="edge-base"/><use href="#e1" class="edge-flow"/>
  <use href="#e2" class="edge-base"/><use href="#e2" class="edge-flow"/>
  <use href="#e3" class="edge-base"/><use href="#e3" class="edge-flow"/>
  <use href="#e4" class="edge-base"/><use href="#e4" class="edge-flow"/>
  <use href="#s1" class="sub-flow"/><use href="#s2" class="sub-flow"/><use href="#s3" class="sub-flow"/>

  <!-- data packets -->
  <g filter="url(#glow)">
    <circle r="4" fill="#ff2a6d"><animateMotion dur="1.5s" repeatCount="indefinite"><mpath href="#e1"/></animateMotion></circle>
    <circle r="3.5" fill="#05d9e8"><animateMotion dur="2s" begin="0.4s" repeatCount="indefinite"><mpath href="#e2"/></animateMotion></circle>
    <circle r="3.5" fill="#05d9e8"><animateMotion dur="2s" begin="0.9s" repeatCount="indefinite"><mpath href="#e3"/></animateMotion></circle>
    <circle r="3.5" fill="#05d9e8"><animateMotion dur="2s" begin="1.4s" repeatCount="indefinite"><mpath href="#e4"/></animateMotion></circle>
  </g>

  <!-- trigger node -->
  <rect x="40" y="133" width="160" height="64" rx="10" class="node"/>
  <path d="M62 150 l-8 16 h7 l-3 13 l11 -18 h-7 l4 -11 z" fill="#f9f002" filter="url(#glow)"/>
  <text x="82" y="161" class="title">TRIGGER</text>
  <text x="82" y="179" class="sub">webhook · cron</text>
  <circle cx="200" cy="165" r="5" class="port" stroke="#ff2a6d"/>

  <!-- agent node -->
  <rect x="345" y="122" width="190" height="86" rx="14" fill="#ff2a6d" filter="url(#bigglow)" class="pulse"/>
  <rect x="340" y="117" width="200" height="96" rx="14" fill="#140f19" stroke="#ff2a6d" stroke-width="2"/>
  <g transform="translate(362 148)" fill="none" stroke="#ff2a6d" stroke-width="2" filter="url(#glow)">
    <rect x="0" y="4" width="26" height="20" rx="5"/>
    <path d="M13 4 V-2"/><circle cx="13" cy="-4" r="2" fill="#ff2a6d"/>
    <circle cx="8" cy="14" r="2" fill="#05d9e8" stroke="none" class="blink"/>
    <circle cx="18" cy="14" r="2" fill="#05d9e8" stroke="none" class="blink"/>
  </g>
  <text x="400" y="162" fill="#ff2a6d" font-size="17" font-weight="700" letter-spacing="1">AI AGENT</text>
  <text x="400" y="181" class="sub">reason · plan · act</text>
  <circle cx="340" cy="165" r="5" class="port" stroke="#ff2a6d"/>
  <circle cx="540" cy="165" r="5" class="port" stroke="#05d9e8"/>

  <!-- agent sub-nodes -->
  <g font-size="12" font-weight="700" text-anchor="middle">
    <rect x="292" y="258" width="86" height="34" rx="17" class="node" stroke="#05d9e8" stroke-opacity=".6"/>
    <text x="335" y="279" fill="#05d9e8">LLM</text>
    <rect x="397" y="258" width="86" height="34" rx="17" class="node" stroke="#05d9e8" stroke-opacity=".6"/>
    <text x="440" y="279" fill="#05d9e8">MEMORY</text>
    <rect x="502" y="258" width="86" height="34" rx="17" class="node" stroke="#05d9e8" stroke-opacity=".6"/>
    <text x="545" y="279" fill="#05d9e8">TOOLS</text>
  </g>

  <!-- output nodes -->
  <rect x="700" y="74" width="160" height="48" rx="10" class="node out d1"/>
  <text x="718" y="95" class="title">CRM</text>
  <text x="718" y="111" class="sub">leads · deals</text>
  <circle cx="700" cy="98" r="5" class="port" stroke="#05d9e8"/>

  <rect x="700" y="141" width="160" height="48" rx="10" class="node out d2"/>
  <text x="718" y="162" class="title">MESSENGERS</text>
  <text x="718" y="178" class="sub">telegram · email</text>
  <circle cx="700" cy="165" r="5" class="port" stroke="#05d9e8"/>

  <rect x="700" y="208" width="160" height="48" rx="10" class="node out d3"/>
  <text x="718" y="229" class="title">DATA</text>
  <text x="718" y="245" class="sub">sql · sheets · apis</text>
  <circle cx="700" cy="232" r="5" class="port" stroke="#05d9e8"/>

  <!-- status line -->
  <text x="40" y="310" font-size="12" fill="#8b949e">&gt; <tspan fill="#c9d1d9">status:</tspan> <tspan fill="#f9f002">automating the boring stuff</tspan></text>
  <rect x="318" y="300" width="8" height="13" fill="#f9f002" class="blink"/>
</svg>
