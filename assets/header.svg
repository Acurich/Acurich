<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 260" width="900" height="260" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <radialGradient id="gl" cx="15%" cy="40%" r="60%">
      <stop offset="0" stop-color="#ff2a6d" stop-opacity=".28"/>
      <stop offset="1" stop-color="#ff2a6d" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="gr" cx="90%" cy="70%" r="55%">
      <stop offset="0" stop-color="#05d9e8" stop-opacity=".22"/>
      <stop offset="1" stop-color="#05d9e8" stop-opacity="0"/>
    </radialGradient>
    <pattern id="scan" width="4" height="4" patternUnits="userSpaceOnUse">
      <rect width="4" height="1" fill="#000" opacity=".35"/>
    </pattern>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#1a2230" stroke-width="1"/>
    </pattern>
    <clipPath id="slice1"><rect x="0" y="70" width="900" height="16">
      <animate attributeName="y" values="70;70;112;96;140;70" keyTimes="0;.84;.88;.92;.96;1" dur="4s" repeatCount="indefinite"/>
    </rect></clipPath>
    <clipPath id="slice2"><rect x="0" y="120" width="900" height="10">
      <animate attributeName="y" values="120;120;84;132;104;120" keyTimes="0;.84;.87;.91;.95;1" dur="4s" repeatCount="indefinite"/>
    </rect></clipPath>
    <style>
      .logo { font-family: 'Arial Black','Segoe UI Black',Impact,'Helvetica Neue',sans-serif; font-weight: 900; font-size: 104px; letter-spacing: 6px; }
      .mono { font-family: 'JetBrains Mono','Fira Code',Consolas,'Courier New',monospace; }
      .blink { animation: blink 1.1s steps(1) infinite; }
      @keyframes blink { 50% { opacity: 0; } }
    </style>
  </defs>

  <!-- background -->
  <rect width="900" height="260" rx="14" fill="#0b0f16"/>
  <rect width="900" height="260" rx="14" fill="url(#grid)" opacity=".7"/>
  <rect width="900" height="260" rx="14" fill="url(#gl)"/>
  <rect width="900" height="260" rx="14" fill="url(#gr)"/>

  <!-- HUD corners -->
  <g stroke="#05d9e8" stroke-width="2" fill="none" opacity=".8">
    <path d="M18 44V18H44"/><path d="M856 18H882V44"/>
    <path d="M18 216V242H44"/><path d="M856 242H882V216"/>
  </g>
  <text x="34" y="40" class="mono" font-size="11" fill="#05d9e8" letter-spacing="2">// ID: ACURICH.SYS</text>
  <g class="mono" font-size="11" letter-spacing="2">
    <rect x="752" y="28" width="9" height="9" fill="#f9f002" class="blink"/>
    <text x="768" y="37" fill="#f9f002">SYS.ONLINE</text>
  </g>

  <!-- logo: chromatic layers -->
  <g text-anchor="middle">
    <text x="447" y="150" class="logo" fill="#05d9e8" opacity=".85">ACURICH</text>
    <text x="453" y="150" class="logo" fill="#ff2a6d" opacity=".85">ACURICH</text>
    <text x="450" y="150" class="logo" fill="#f2f4f8">ACURICH
      <animate attributeName="opacity" values="1;1;.6;1;.8;1" keyTimes="0;.84;.87;.9;.93;1" dur="4s" repeatCount="indefinite"/>
    </text>
    <!-- glitch slices -->
    <g clip-path="url(#slice1)">
      <text x="450" y="150" class="logo" fill="#ff2a6d">ACURICH</text>
      <animateTransform attributeName="transform" type="translate" values="0 0;0 0;-22 0;14 0;-6 0;0 0" keyTimes="0;.84;.88;.92;.96;1" dur="4s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;0;1;1;1;0" keyTimes="0;.84;.85;.92;.97;1" dur="4s" repeatCount="indefinite"/>
    </g>
    <g clip-path="url(#slice2)">
      <text x="450" y="150" class="logo" fill="#05d9e8">ACURICH</text>
      <animateTransform attributeName="transform" type="translate" values="0 0;0 0;18 0;-12 0;8 0;0 0" keyTimes="0;.84;.87;.91;.95;1" dur="4s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;0;1;1;1;0" keyTimes="0;.84;.85;.91;.96;1" dur="4s" repeatCount="indefinite"/>
    </g>
  </g>

  <!-- tagline -->
  <g class="mono" text-anchor="middle">
    <rect x="270" y="172" width="360" height="26" fill="#ff2a6d"/>
    <text x="450" y="190" font-size="14" font-weight="700" fill="#0b0f16" letter-spacing="3">AI AUTOMATION // NETRUNNER</text>
    <text x="450" y="226" font-size="13" fill="#8b949e" letter-spacing="1">[ n8n · ai agents · llm integrations ]</text>
  </g>

  <!-- barcode -->
  <g fill="#05d9e8" opacity=".6">
    <rect x="34" y="200" width="2" height="18"/><rect x="39" y="200" width="4" height="18"/><rect x="46" y="200" width="1" height="18"/>
    <rect x="50" y="200" width="3" height="18"/><rect x="56" y="200" width="1" height="18"/><rect x="60" y="200" width="5" height="18"/>
    <rect x="68" y="200" width="2" height="18"/><rect x="73" y="200" width="1" height="18"/><rect x="77" y="200" width="3" height="18"/>
  </g>
  <text x="846" y="236" class="mono" font-size="11" fill="#ff2a6d" letter-spacing="2" text-anchor="end">WORLDWIDE · REMOTE</text>

  <rect width="900" height="260" rx="14" fill="url(#scan)"/>
</svg>
